[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "ChronusBOT-API"
version = "1.0.0"
description = "Bot para processamento de streams da Twitch"
license = "MIT"
readme = "README.md"
packages = [{include = "modules"}]

[tool.poetry.dependencies]
python = "^3.8"
requests = "^2.31.0"
colorama = "^0.4.6"
fake-useragent = "^1.4.0"
logging = "*"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.7.0"
isort = "^5.12.0"
flake8 = "^6.1.0"
mypy = "^1.5.1"

[tool.black]
line-length = 100
target-version = ['py38']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi-line-output = 3
line-length = 100

[tool.mypy]
python-version = "3.8"
disallow-untyped-defs = true
disallow-incomplete-defs = true
check-untyped-defs = true
disallow-untyped-decorators = true
no-implicit-optional = true
warn-redundant-casts = true
warn-unused-ignores = true
warn-return-any = true
warn-unreachable = true
strict-optional = true

[tool.pytest.ini-options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[project.urls]
"Homepage" = "https://github.com/Lucaszmv/ChronusBOT-API.git"
"Bug Tracker" = "https://github.com/Lucaszmv/ChronusBOT-API/issues"
